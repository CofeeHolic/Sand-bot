name: Deploy Trading Bot

on:
  push:
    branches:
      - trading-bot-implementation   # run only when you push to this branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Deploy to AWS server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~/sand-bot/sand-bot
            git fetch origin
            git reset --hard origin/trading-bot-implementation
            source venv/bin/activate
            pip install -r requirements.txt
            nohup python3.10 trading_bot.py > bot.log 2>&1 &
